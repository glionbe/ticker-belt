<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ticker Belt</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="widget" id="widget">

  <!-- The bar itself. Everything with data-tauri-drag-region moves the window. -->
  <div class="bar">
    <div class="status" id="status" data-tauri-drag-region>
      <span class="dot" id="dot"></span>
      <span id="statusText" data-tauri-drag-region>Demo</span>
    </div>

    <div class="tape" id="tape" data-tauri-drag-region>
      <div class="track" id="track"></div>
      <div class="fade fade-l"></div>
      <div class="fade fade-r"></div>
    </div>

    <!-- Buttons must sit OUTSIDE any drag region or their clicks get eaten. -->
    <div class="controls">
      <button class="icon" id="gear" title="Settings" aria-label="Settings">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 10.5a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5Z" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M8 1.75v1.5M8 12.75v1.5M14.25 8h-1.5M3.25 8h-1.5M12.42 3.58l-1.06 1.06M4.64 11.36l-1.06 1.06M12.42 12.42l-1.06-1.06M4.64 4.64 3.58 3.58" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
      </button>
      <button class="icon" id="close" title="Close" aria-label="Close">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4.5 4.5l7 7M11.5 4.5l-7 7" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
      </button>
    </div>
  </div>

  <!-- Settings. The window grows to make room for this when it opens. -->
  <div class="panel" id="panel" hidden>
    <div class="panelInner">

      <div class="field">
        <label class="name" for="symbols">Symbols</label>
        <input type="text" id="symbols" spellcheck="false" autocapitalize="characters">
        <p class="hint">Comma separated, up to 20.</p>
      </div>

      <div class="field">
        <label class="name" for="apikey">Finnhub API key</label>
        <input type="password" id="apikey" spellcheck="false" placeholder="Leave empty for demo prices">
        <p class="hint">Free key at finnhub.io/register. Without one the widget
          shows simulated prices.</p>
      </div>

      <div class="field">
        <span class="name">Refresh every</span>
        <div class="seg" id="refresh">
          <button data-v="15" aria-pressed="false">15s</button>
          <button data-v="30" aria-pressed="false">30s</button>
          <button data-v="60" aria-pressed="false">60s</button>
        </div>
      </div>

      <div class="row">
        <div class="field">
          <label class="name" for="speed">Speed <span class="val" id="speedVal"></span></label>
          <input type="range" id="speed" min="15" max="160" step="5">
        </div>
        <div class="field">
          <label class="name" for="opacity">Opacity <span class="val" id="opacityVal"></span></label>
          <input type="range" id="opacity" min="30" max="100" step="5">
        </div>
      </div>

      <div class="field">
        <span class="name">Direction</span>
        <div class="seg" id="dir">
          <button data-v="left" aria-pressed="false">Right to left</button>
          <button data-v="right" aria-pressed="false">Left to right</button>
        </div>
      </div>

      <div class="field">
        <span class="name">Bar height</span>
        <div class="seg" id="size">
          <button data-v="slim" aria-pressed="false">Slim</button>
          <button data-v="standard" aria-pressed="false">Standard</button>
          <button data-v="tall" aria-pressed="false">Tall</button>
        </div>
      </div>

      <div class="field">
        <span class="name">Bar width</span>
        <div class="seg" id="width">
          <button data-v="620" aria-pressed="false">Narrow</button>
          <button data-v="900" aria-pressed="false">Medium</button>
          <button data-v="1280" aria-pressed="false">Wide</button>
        </div>
        <p class="hint">You can also drag the left or right edge.</p>
      </div>

      <div class="field">
        <span class="name">Change shown as</span>
        <div class="seg" id="chg">
          <button data-v="pct" aria-pressed="false">Percent</button>
          <button data-v="abs" aria-pressed="false">Dollars</button>
          <button data-v="both" aria-pressed="false">Both</button>
        </div>
      </div>

      <div class="field">
        <span class="name">Theme</span>
        <div class="seg" id="theme">
          <button data-v="dark" aria-pressed="false">Dark</button>
          <button data-v="light" aria-pressed="false">Light</button>
        </div>
      </div>

      <div class="field checks">
        <label class="check"><input type="checkbox" id="ontop"> Keep above other windows</label>
        <label class="check"><input type="checkbox" id="hoverpause"> Stop scrolling on hover</label>
      </div>

      <div class="foot">
        <button class="btn" id="reset">Reset</button>
        <span class="hint" id="build">Prices are simulated</span>
      </div>

    </div>
  </div>

</div>

<script src="app.js"></script>
</body>
</html>
